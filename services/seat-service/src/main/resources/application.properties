spring.application.name=Seat Service
server.port=${SERVER_PORT:8080}
service.instance.id=${SERVICE_INSTANCE_ID:SEAT-SERVICE-1}

# Database Configuration (MySQL / H2 Dynamic fallback)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysqldb}:${DB_PORT:3306}/${DB_NAME:smartticketdb}?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Security / JWT
jwt.secret=9a2f8c4e7b1a5d3f8e0b2c4a6f8e1d3c5b7a9f0e2d4c6b8a1f3e5d7c9b0a2f4e
jwt.expiration-ms=86400000

logging.level.com.smartticket=INFO
