spring.application.name=SmartTicket Backend
server.port=8080

# H2 Database configuration (Default Out-of-the-box in-memory / file mode)
spring.datasource.url=jdbc:h2:mem:smartticketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Security / JWT
jwt.secret=9a2f8c4e7b1a5d3f8e0b2c4a6f8e1d3c5b7a9f0e2d4c6b8a1f3e5d7c9b0a2f4e
jwt.expiration-ms=86400000

# Logging
logging.level.com.smartticket=INFO
logging.level.org.hibernate.SQL=WARN
